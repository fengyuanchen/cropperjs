<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Cropper.js</title>
  <link rel="stylesheet" href="../css/cropper.css">
  <style>
    .container {
      margin: 20px auto;
      max-width: 640px;
    }

    img {
      max-width: 100%;
    }

    .docs-toolbar {
      margin-bottom: 1em;
    }

    .docs-toolbar label {
      margin-right: 0.5em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cropper with a configurable border radius</h1>
    <div class="docs-toolbar">
      <label for="border-radius">borderRadius:</label>
      <select id="border-radius">
        <option value="0">0 (none)</option>
        <option value="25px">25px</option>
        <option value="50px">50px</option>
        <option value="100px">100px</option>
        <option value="25%">25%</option>
        <option value="50%">50%</option>
        <option value="100%">100%</option>
        <option value="25% 10%">25% 10%</option>
        <option value="10% 30% 50%">10% 30% 50%</option>
        <option value="10% 30% 50% 70%">10% 30% 50% 70%</option>
        <option value="10% / 50%">10% / 50%</option>
        <option value="10% 30% / 50% 70%">10% 30% / 50% 70%</option>
        <option value="10% 30% 50% / 20% 40% 60%">10% 30% 50% / 20% 40% 60%</option>
        <option value="10% 30% 50% 70% / 20% 40% 60% 80%">10% 30% 50% 70% / 20% 40% 60% 80%</option>
      </select>
    </div>
    <div>
      <img id="image" src="../images/picture.jpg" alt="Picture">
    </div>
    <h3>Result</h3>
    <p>
      <button type="button" id="button">Crop</button>
    </p>
    <div id="result"></div>
  </div>
  <script src="../js/cropper.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var image = document.getElementById('image');
      var select = document.getElementById('border-radius');
      var button = document.getElementById('button');
      var result = document.getElementById('result');
      var croppable = false;
      var cropper = new Cropper(image, {
        aspectRatio: 16 / 9,
        borderRadius: select.value,
        ready: function () {
          croppable = true;
        },
      });

      select.onchange = function () {
        cropper.options.borderRadius = select.value;

        // Force the crop box to re-render with the new border radius
        cropper.setCropBoxData(cropper.getCropBoxData());
      };

      button.onclick = function () {
        var croppedCanvas;
        var roundedImage;

        if (!croppable) {
          return;
        }

        // Crop
        croppedCanvas = cropper.getCroppedCanvas();

        // Show
        roundedImage = document.createElement('img');
        roundedImage.src = croppedCanvas.toDataURL();
        result.innerHTML = '';
        result.appendChild(roundedImage);
      };
    });
  </script>
</body>
</html>
